[project]
name = "workshop-agent-memory-semantic-cache-trip-planning-langgraph"
version = "1.0.0"
description = "A trip planning agent for learning agent memory with Redis Agent Memory, LangGraph and Google Maps."
authors = [{ name = "Ashwin Hariharan" }]
maintainers = [{ name = "Ashwin Hariharan" }]
keywords = ["redis", "agent-memory", "ai-agents", "langgraph", "workshop"]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.30.0,<2",
    "redis-iris>=1.2.0",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
    "redisvl>=0.33.0",
]

[dependency-groups]
# Lets you run the `# %%` cells of the exercise files in VS Code or Jupyter
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "jupytext>=1.19.7",
]

[tool.uv]
# This is an app, not a package to install
package = false
# redis-iris lists services this app does not use. One of them needs mcp 2, but the Google Maps tools need mcp 1.
exclude-dependencies = ["redis-context-gateway", "redis-agent-playbook", "redis-intent-router"]

[tool.vercel]
# Where Vercel finds the app. Other tools ignore this
entrypoint = "backend.main:app"
