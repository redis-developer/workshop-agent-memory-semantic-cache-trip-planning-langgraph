[project]
name = "workshop-agent-memory-playbook-trip-planning-python"
version = "1.0.0"
description = "A trip planning agent for learning agent memory with Redis Agent Memory, LangGraph and Google Maps."
authors = [{ name = "Ashwin Hariharan" }]
maintainers = [{ name = "Ashwin Hariharan" }]
keywords = ["redis", "agent-memory", "ai-agents", "langgraph", "workshop"]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.2",
    "mcp>=1.9,<2",
    "redis-agent-memory>=1.1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
# Lets you run the `# %%` cells of the exercise files in VS Code or Jupyter
dev = [
    "ipykernel>=6.29",
    "jupyterlab",
    "jupytext",
]

[tool.uv]
# This is an app, not a package to install
package = false
